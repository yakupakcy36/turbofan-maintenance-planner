name: Verify FD001 planner

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Fetch NASA archive
        run: turbofan-rul fetch "$RUNNER_TEMP/cmapss.zip"
      - name: Evaluate official held-out engines
        run: turbofan-rul benchmark "$RUNNER_TEMP/cmapss.zip" --out reports/fd001
      - name: Verify the saved model through the CLI
        shell: bash
        run: |
          printf '## FD001 evaluation\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          python tests/verify_benchmark.py "$RUNNER_TEMP/cmapss.zip" reports/fd001 | tee -a "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: fd001-maintenance-report
          path: reports/fd001/
          if-no-files-found: error
